services:
  agentic-coding-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-final}
    image: ${IMAGE_NAME:-agentic-coding-pipeline:latest}
    container_name: ${CONTAINER_NAME:-agentic-coding-container}
    
    # Enable Docker-in-Docker
    privileged: true
    
    # Port mappings for development services
    ports:
      - "3000:3000"   # General web development
      - "8000:8000"   # Python/Django development
      - "8080:8080"   # Alternative web port
      - "9000:9000"   # Additional service port
      - "5901:5901"   # VNC server
      - "6080:6080"   # NoVNC web interface
      - "3389:3389"   # xRDP server (Remote Desktop Protocol)
    
    # Volume mounts for persistent development work
    volumes:
      - ./workspace:/workspace
      - ./configs:/opt/configs
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for DinD
      - agentic-data:/home/developer
    
    # Environment variables
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - WORKSPACE_DIR=/workspace
      - PIPELINES_DIR=/opt/pipelines
      - TOOLS_DIR=/opt/tools
      - CONFIGS_DIR=/opt/configs
      - DISPLAY=:1
      - VNC_RESOLUTION=1920x1080
      - VNC_DEPTH=24
    
    # Working directory (can be overridden with WORKDIR env var)
    working_dir: ${WORKDIR:-/workspace}

    # Command to run (can be overridden with COMPOSE_COMMAND env var)
    command: ${COMPOSE_COMMAND:-/usr/bin/supervisord -c /etc/supervisor/supervisord.conf}

    # Keep container running
    tty: true
    stdin_open: true

    # Restart policy
    restart: unless-stopped
    
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          memory: 5G
          cpus: '2.0'
        reservations:
          memory: 3G
          cpus: '1.0'

# Named volumes for data persistence
volumes:
  agentic-data:
    driver: local

# Network configuration
networks:
  default:
    name: agentic-network
    driver: bridge