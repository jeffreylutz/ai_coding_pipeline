apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: agentic-coding-pipeline-production

# Base resources
resources:
  - ../../kubernetes/deployment.yaml

# Namespace for production
namespace: production

# Name prefix for all resources
namePrefix: prod-

# Common labels for all resources
commonLabels:
  environment: production
  version: v1.0.0

# Images to use (will be overridden by deployment script)
images:
  - name: agentic-coding-pipeline
    newTag: latest

# Patches for production environment
patches:
  # Increase resource requirements for production
  - target:
      kind: Deployment
      name: agentic-coding-pipeline
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "4Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "16Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "8000m"
      
  # Add production-specific environment variables
  - target:
      kind: Deployment
      name: agentic-coding-pipeline
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENVIRONMENT
          value: "production"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DEBUG
          value: "false"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: "info"

  # Increase PVC size for production
  - target:
      kind: PersistentVolumeClaim
      name: agentic-workspace-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "50Gi"

  # Add production-specific security context
  - target:
      kind: Deployment
      name: agentic-coding-pipeline
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000

  # Add production-specific node selector
  - target:
      kind: Deployment
      name: agentic-coding-pipeline
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: "compute-optimized"

  # Add production-specific tolerations
  - target:
      kind: Deployment
      name: agentic-coding-pipeline
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: "production-workload"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"

# ConfigMap generator for production-specific config
configMapGenerator:
  - name: agentic-config-production
    literals:
      - environment=production
      - log_level=info
      - debug=false
      - max_pipeline_projects=10
      - enable_experimental_features=false
      - enable_monitoring=true
      - enable_metrics=true

# Secret generator for production API keys (will be created separately)
secretGenerator:
  - name: agentic-secrets-production
    literals:
      - anthropic_api_key=placeholder
      - openai_api_key=placeholder
      - google_api_key=placeholder